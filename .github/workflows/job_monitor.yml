name: Check Technical Artist Jobs

on:
  schedule:
    # Runs twice daily at 09:00 UTC and 18:00 UTC
    - cron: '0 9,18 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Job Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Pass webhook from secret if available
          python -c "
          import json, os
          if os.path.exists('config.json') and os.environ.get('DISCORD_WEBHOOK_URL'):
              with open('config.json', 'r') as f:
                  cfg = json.load(f)
              cfg['notifications']['discord_webhook_url'] = os.environ['DISCORD_WEBHOOK_URL']
              with open('config.json', 'w') as f:
                  json.dump(cfg, f, indent=2)
          "
          python job_monitor.py

      - name: Commit and push updated seen jobs database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update seen jobs database [skip ci]"
          git push
